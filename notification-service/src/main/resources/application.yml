server:
  port: 8088

spring:
  application:
    # FIX: Must match what API Gateway routes to. Gateway uses lb://NOTIFICATION-SERVICE
    # Eureka is case-insensitive, so "notification-service" registers as NOTIFICATION-SERVICE
    name: notification-service

  datasource:
    url: jdbc:mysql://localhost:3306/notification_db
    username: root
    password: mysql@123
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # FIX: Disable open-in-view to avoid lazy loading issues and hide the WARN log
    open-in-view: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # FIX: Do not auto-acknowledge — only ack after successful processing
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3

  mail:
    host: smtp.gmail.com
    port: 587
    username: tanishapachpande0072@gmail.com
    # Use your Gmail App Password here (16 chars, no spaces)
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  file:
    name: logs/notification-service.log
  level:
    com.medibook.notification: DEBUG
