server:
  port: 8085

spring:
  application:
    name: APPOINTMENT-SERVICE
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/appointment_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql@123}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  file:
    name: logs/appointment-service.log
  level:
    com.medibook.appointment: DEBUG